name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false

      - name: Check release status
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi

          echo "Detected version: $VERSION"
          echo "Detected tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package extension
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          npm run build
          npm run zip
          VERSION="${{ steps.check_release.outputs.version }}"
          cp ".output/form-keeper-${VERSION}-chrome.zip" ".output/form-keeper-chrome.zip"

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_release.outputs.tag }}"
          VERSION="${{ steps.check_release.outputs.version }}"

          gh release create "$TAG" \
            ".output/form-keeper-${VERSION}-chrome.zip" \
            ".output/form-keeper-chrome.zip" \
            --title "form-keeper $VERSION" \
            --generate-notes
