<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom controls</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      /* Deliberately unrecognisable: no roles, no ARIA, none of the usual class-name hints. */
      .pk { position: relative; border: 1px solid #888; border-radius: 6px; padding: 0.4rem 0.6rem; cursor: pointer; background: #fff; color: #000; }
      .pk-pop { position: absolute; left: 0; top: 100%; z-index: 20; background: #fff; color: #000; border: 1px solid #888; min-width: 100%; }
      .pk-pop[hidden] { display: none; }
      .pk-row { padding: 0.3rem 0.6rem; }
      .pk-row:hover { background: #e0e7ff; }
      .pk-off { opacity: .55; cursor: not-allowed; }
      .portal-pop { position: absolute; z-index: 20; background: #fff; color: #000; border: 1px solid #888; }
    </style>
  </head>
  <body>
    <h1>Custom controls</h1>
    <p><a href="/">← all fixtures</a> · dropdowns built from plain divs: nothing here follows a standard, so they need teaching.</p>
    <form id="custom" onsubmit="return false">
      <div class="field">
        <label>Favourite city</label>
        <div class="pk" id="city"><div class="pk-v">Pick one…</div><div class="pk-pop" hidden></div></div>
      </div>
      <div class="field">
        <label>Favourite fruit (list opens in a portal)</label>
        <div class="pk" id="fruit"><div class="pk-v">Pick one…</div></div>
      </div>
      <div class="field">
        <label>Area (needs a city first)</label>
        <div class="pk pk-off" id="area"><div class="pk-v">Pick a city first…</div><div class="pk-pop" hidden></div></div>
      </div>
      <h2>State</h2>
      <output data-testid="state"></output>
    </form>
    <script>
      const state = { city: null, fruit: null, area: null };
      const out = document.querySelector('output');
      const show = () => (out.textContent = JSON.stringify(state));
      show();

      function dropdown(id, choices, { portal }) {
        const box = document.getElementById(id);
        const value = box.querySelector('.pk-v');
        let pop = box.querySelector('.pk-pop');
        const close = () => { if (portal) pop?.remove(), (pop = null); else pop.hidden = true; };
        const choose = (text) => { value.textContent = text; state[id] = text; show(); close(); };
        box.addEventListener('click', (e) => {
          if (e.target.closest('.pk-pop')) return;
          if (portal) {
            if (pop) return close();
            pop = document.createElement('div');
            pop.className = 'portal-pop';
            const r = box.getBoundingClientRect();
            pop.style.cssText = `left:${r.left + scrollX}px;top:${r.bottom + scrollY}px;min-width:${r.width}px`;
            document.body.append(pop);
          } else {
            pop.hidden = !pop.hidden;
          }
          pop.replaceChildren(...choices.map((c) => Object.assign(document.createElement('div'), { className: 'pk-row', textContent: c, onclick: () => choose(c) })));
        });
        if (!portal) pop.replaceChildren(...choices.map((c) => Object.assign(document.createElement('div'), { className: 'pk-row', textContent: c, onclick: () => choose(c) })));
      }
      // A dependent control: it ignores clicks (no ARIA, no standard disabled class) until a city
      // is chosen, and only comes alive a moment later.
      const AREAS = { Singapore: ['Orchard', 'Marina'], Jakarta: ['Menteng', 'Kemang'], Bangkok: ['Silom', 'Sukhumvit'] };
      const area = document.getElementById('area');
      const areaValue = area.querySelector('.pk-v');
      const areaPop = area.querySelector('.pk-pop');
      let areaChoices = [];
      function fillArea() {
        areaPop.replaceChildren(...areaChoices.map((c) => Object.assign(document.createElement('div'), { className: 'pk-row', textContent: c, onclick: () => { areaValue.textContent = c; state.area = c; show(); areaPop.hidden = true; } })));
      }
      area.addEventListener('click', (e) => {
        if (area.classList.contains('pk-off') || e.target.closest('.pk-pop')) return;
        areaPop.hidden = !areaPop.hidden;
      });
      document.getElementById('city').addEventListener('click', () => {
        setTimeout(() => {
          if (!state.city) return;
          areaChoices = AREAS[state.city];
          state.area = null;
          areaValue.textContent = 'Pick one…';
          fillArea();
          setTimeout(() => area.classList.remove('pk-off'), 700);
        }, 0);
      });
      dropdown('city', ['Singapore', 'Jakarta', 'Bangkok'], { portal: false });
      dropdown('fruit', ['Mango', 'Durian', 'Rambutan'], { portal: true });
    </script>
  </body>
</html>
